{% load static %}
<section class="destination" aria-labelledby="destination-title">
    <div class="section-heading">
        <div><p class="eyebrow">POSTALES DEL FIN DEL MUNDO</p><h2 id="destination-title">Un destino. Mil formas de vivirlo.</h2></div>
        <p>Fotografías de Rodrigo Herrainz</p>
    </div>
    <div class="destination-grid">
        <figure>
            <img src="{% static 'market/images/photos/beagle-800.webp' %}" alt="Agua transparente y montañas junto a la costa" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>Agua, montaña y silencio</figcaption>
        </figure>
        <figure>
            <img src="{% static 'market/images/photos/sunrise-800.webp' %}" alt="Sol entre nubes y montañas de Ushuaia" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>La primera luz</figcaption>
        </figure>
        <figure>
            <img src="{% static 'market/images/photos/city-800.webp' %}" alt="Ciudad y montañas bajo un cielo azul" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>Una ciudad entre montañas</figcaption>
        </figure>
        <figure>
            <img src="{% static 'market/images/photos/winter-800.webp' %}" alt="Montañas nevadas al anochecer" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>Cuando cae la tarde</figcaption>
        </figure>
        <figure>
            <img src="{% static 'market/images/photos/road-800.webp' %}" alt="Ruta entre montañas nevadas bajo las estrellas" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>El camino también es el viaje</figcaption>
        </figure>
        <figure>
            <img src="{% static 'market/images/photos/snow-800.webp' %}" alt="Ciudad y cordillera nevada junto a la bahía" width="800" height="600" loading="lazy" decoding="async">
            <figcaption>El sur, vestido de invierno</figcaption>
        </figure>
    </div>
</section>
