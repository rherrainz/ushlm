{% extends 'base.html' %}

{% block content %}
    <section class="form-page">
        <p class="eyebrow">TU PRÓXIMO PLAN EMPIEZA ACÁ</p>
        <h1>Ingresá a tu cuenta</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <input type="hidden" name="next" value="{{ next }}">
            <button>Ingresar</button>
        </form>
        <p>¿Primera vez? <a href="{% url 'signup' %}">Creá tu cuenta de turista</a></p>
    </section>
{% endblock %}
